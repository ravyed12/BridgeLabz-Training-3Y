<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>use of multiple inline element</title>
</head>
<body>
    <p>
    I am a <strong>B.Tech student</strong> who is <em>passionate</em> about
    learning new technologies and improving my skills.<br>
    I enjoy <mark>programming</mark> and exploring creative ideas.
    <small>Keep learning, keep growing!</small>
</p>
</body>
</html>
