<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <h1>Sunrise Public School</h1>
    <h2>Student Report Card</h2>

    
    <table border="5" cellpadding="6">
        <tr>
            <th title="Subject Name">Subject</th>
            <th title="Marks out of 100">Marks Obtained</th>
            <th title="Maximum possible marks">Max Marks</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>88</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Chemistry</td>
            <td>85</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
        </tr>
        <tr>
            <td>English</td>
            <td>90</td>
            <td>100</td>
        </tr>

        <tr>
            <td colspan="2" title="Sum of marks in all subjects">Total</td>
            <td>450 / 500</td>
        </tr>
        <tr>
            <td colspan="2" title="Overall percentage score">Percentage</td>
            <td>90%</td>
        </tr>
    </table>

</body>
</html>
