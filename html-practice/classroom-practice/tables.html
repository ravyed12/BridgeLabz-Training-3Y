<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Website</title>
    <style>
        /* General page styling */
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 20px 5%; 
            background-color: #ffffff; 
        }

        .top-header {
            text-align: right;
            margin-bottom: 30px;
        }

        .top-header h1 {
            font-size: 1.8rem;
            font-weight: normal;
            color: #888; 
            margin: 0;
        }

        
        .content-box {
            background-color: #e0f2f1; 
            border: 1px solid #b0bec5; 
            padding: 50px 40px;
            text-align: center; 
            max-width: 1000px;
            margin: 0 auto; 
        }

        .content-box h2 {
            font-size: 3.5rem;
            font-weight: normal;
            color: #555; 
            margin-top: 0;
            margin-bottom: 20px;
        }

        .nav-links {
            margin-bottom: 40px;
        }

        .nav-links a {
            color: #0000ee; 
            text-decoration: underline;
            font-size: 1.2rem;
            margin: 0 10px; 
        }

        
        .content-box p {
            font-size: 1.2rem;
            line-height: 1.5;
            color: #888; 
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <h1>welcome to website</h1>
    </header>

    <main>
        <div class="content-box">
            <h2>welcome</h2>
            
            <div class="nav-links">
                <a href="#">home</a>
                <a href="#">about</a>
                <a href="#">contact</a>
            </div>

            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit. Asperiores officiis fugiat possimus laudantium illo eaque suscipit recusandae nesciunt omnis ullam, odio exercitationem animi sunt porro architecto harum quis cum rem?
            </p>
        </div>
    </main>

</body>
</html>
