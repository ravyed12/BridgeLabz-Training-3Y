<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demo</title>
<link rel="stylesheet" href="2.css">
</head>
<body>
<header>
<h1>CSS Tooltips</h1>
<p>Hover over any item to see its tooltip.</p>
</header>
<main>
<section class="tooltips">
<div class="tooltip">
<span class="item">&#127968; Home</span>
<span class="tip">Go back to the home page</span>
</div>
<div class="tooltip">
<span class="item">&#9993; Mail</span>
<span class="tip">Check your inbox</span>
</div>
<div class="tooltip">
<span class="item">&#9881; Settings</span>
<span class="tip">Change your preferences</span>
</div>
<div class="tooltip">
<span class="item">HTML</span>
<span class="tip">HyperText Markup Language</span>
</div>
<div class="tooltip">
<span class="item">CSS</span>
<span class="tip">Cascading Style Sheets</span>
</div>
</section>
</main>
<footer>
<p>Assignment 8 - Question 2</p>
</footer>
</body>
</html>
