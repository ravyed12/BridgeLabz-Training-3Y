<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Height and Width Practice Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Height and Width Practice Layout</h1>
</header>
<main class="container">
<div class="box box-px">
<p>Width: 300px</p>
<p>Height: 150px</p>
</div>
<div class="box box-percent">
<p>Width: 50%</p>
<p>Min-height: 120px</p>
</div>
<div class="box box-vh-em">
<p>Height: 25vh</p>
<p>Max-width: 20em</p>
<p class="overflow-text">This box has a lot of extra text to demonstrate the overflow property in action when content exceeds the box size.</p>
</div>
</main>
<footer>
<p>Boxes centered using Flexbox alignment</p>
</footer>
</body>
</html>
