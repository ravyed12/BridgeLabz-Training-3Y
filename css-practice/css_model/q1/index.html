<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Borders and Padding Demonstration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Borders and Padding Demonstration</h1>
</header>
<main>
<section class="box-row">
<div class="box solid">Solid Border<br>Padding: 10px</div>
<div class="box dashed">Dashed Border<br>Padding: 20px</div>
<div class="box double">Double Border<br>Padding: 30px</div>
<div class="box groove">Groove Border<br>Padding: 15px</div>
</section>
<section class="box-row">
<div class="box rounded-small">Small Radius</div>
<div class="box rounded-medium">Medium Radius</div>
<div class="box rounded-large">Large Radius</div>
<div class="box rounded-circle">Circle</div>
</section>
</main>
<footer>
<p>Hover over any box to see the border color transition</p>
</footer>
</body>
</html>
