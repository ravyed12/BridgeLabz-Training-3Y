<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadows and Depth Effect Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1 class="depth-heading">Shadows and Depth</h1>
</header>
<main class="card-row">
<article class="card card-soft">
<h3>Soft Shadow</h3>
<p>A card with a light, diffused box-shadow for subtle depth.</p>
</article>
<article class="card card-strong">
<h3>Strong Shadow</h3>
<p>A card with a heavier, darker box-shadow for a bold effect.</p>
</article>
<article class="card card-colored">
<h3>Colored Shadow</h3>
<p>A card with a tinted box-shadow to match its accent color.</p>
</article>
</main>
</body>
</html>
