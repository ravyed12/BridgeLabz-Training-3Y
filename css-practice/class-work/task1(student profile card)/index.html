<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="avatar">Student</div>
        
        <h1 class="name">Raghav Pandey</h1>
        <h2 class="major">Computer Science Engineering</h2>
        <p class="institution">Gla University</p>

        <p class="description">
            I am a passionate Computer Science<br>
            student interested in Web Development,<br>
            Java, and problem solving.
        </p>

        <h3 class="skills-heading">Skills</h3>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>Problem Solving</span>
        </div>

        <a href="#" class="contact-btn">Contact Me</a>
    </div>

</body>
</html>
