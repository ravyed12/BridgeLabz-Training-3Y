<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM INPUT</title>
    <style>
        /* Styling to somewhat match the aesthetic of the projector screen */
        body {
            background-color: #fdf6e3; /* Light warm background */
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        h1 {
            font-family: Georgia, serif; /* Serif font like in the image */
            font-weight: normal;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #inputName {
            padding: 8px;
            font-size: 16px;
            border: 1px solid #777;
            width: 250px;
            background-color: transparent;
        }

        #btn {
            padding: 8px 15px;
            font-size: 16px;
            background-color: transparent;
            border: 1px solid #777;
            cursor: pointer;
        }

        #btn:hover {
            background-color: #e6e0cc;
        }

        /* Styling for the dynamic list */
        #list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-width: 330px;
        }

        #list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace; /* Monospace font like the console in the image */
            font-size: 16px;
            padding: 8px 0;
            border-bottom: 1px solid transparent; /* Keeps spacing consistent */
        }

        #list li:hover {
            border-bottom: 1px solid #ccc;
        }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #333;
        }

        .delete-btn:hover {
            color: red;
        }
    </style>
</head>
<body>

    <h1>DOM INPUT</h1>

    <div class="input-group">
        <input type="text" id="inputName" placeholder="type here...">
        <button id="btn">add</button>
    </div>

    <!-- This empty unordered list will hold our dynamically generated items -->
    <ul id="list"></ul>

    <script>
        // 1. Select the necessary elements from the DOM
        const inputEl = document.querySelector("#inputName");
        const btnEl = document.querySelector("#btn");
        const listEl = document.querySelector("#list");

        // 2. Add event listener to the button (changed "clicker" to "click")
        btnEl.addEventListener("click", function() {
            // Get the text from the input and remove extra whitespace
            const textValue = inputEl.value.trim();

            // Do nothing if the input is empty
            if (textValue === "") {
                return;
            }

            // 3. Create the new HTML elements
            const li = document.createElement("li");

            const textSpan = document.createElement("span");
            textSpan.textContent = textValue;

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "✕"; // The 'X' symbol for deletion
            deleteBtn.className = "delete-btn";

            // 4. Add functionality to the delete button
            deleteBtn.addEventListener("click", function() {
                li.remove(); // Removes this specific list item from the DOM
            });

            // 5. Assemble the list item and add it to the page
            li.appendChild(textSpan);
            li.appendChild(deleteBtn);
            listEl.appendChild(li);

            // 6. Clear the input field for the next entry
            inputEl.value = "";
        });

        // Optional: Allow pressing "Enter" key to add items too!
        inputEl.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                btnEl.click();
            }
        });
    </script>
</body>
</html>
